name: CI

# Runs on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # match `python --version` on your machine
          cache: pip

      - name: Install Mosquitto
        run: sudo apt-get update && sudo apt-get install -y mosquitto

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      # Fails if a dependency is missing from requirements.txt.
      - name: Smoke import
        run: python -c "import db, main, retention; from demo.simulator import config, units, defect_model, simulator, mqtt_publisher"

      - name: Tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            echo "No tests/ directory yet, skipping."
          fi

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build