[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:mosquitto]
user=app
command=mosquitto -c /etc/mosquitto/mosquitto.hosted.conf
environment=HOME="/home/app"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:uvicorn]
user=app
command=/bin/sh -c "exec uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
directory=/app
environment=HOME="/home/app",MQTT_USER="%(ENV_BACKEND_MQTT_USER)s",MQTT_PASSWORD="%(ENV_BACKEND_MQTT_PASSWORD)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:simulator]
user=app
command=/bin/sh -c "exec python -m demo.simulator.runner"
directory=/app
environment=HOME="/home/app",MQTT_USER="%(ENV_SIMULATOR_MQTT_USER)s",MQTT_PASSWORD="%(ENV_SIMULATOR_MQTT_PASSWORD)s",MQTT_CLIENT_ID="%(ENV_SIMULATOR_MQTT_CLIENT_ID)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
