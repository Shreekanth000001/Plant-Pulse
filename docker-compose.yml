services:
  auth-init:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: >
      python scripts/generate_mosquitto_auth.py
      --plants-dir plants
      --passwd-path /mosquitto/auth/passwd
      --acl-path /mosquitto/auth/acl.conf
      --backend-user ${BACKEND_MQTT_USER:-backend_service}
      --backend-password ${BACKEND_MQTT_PASSWORD:?BACKEND_MQTT_PASSWORD is required in .env}
    volumes:
      - mosquitto_auth:/mosquitto/auth
    environment:
      BACKEND_MQTT_USER: ${BACKEND_MQTT_USER:-backend_service}
      BACKEND_MQTT_PASSWORD: ${BACKEND_MQTT_PASSWORD:?BACKEND_MQTT_PASSWORD is required in .env}

  broker:
    image: eclipse-mosquitto:2.0.20
    depends_on:
      auth-init:
        condition: service_completed_successfully
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_auth:/mosquitto/auth
      - mosquitto_data:/mosquitto/data
    expose:
      - "1883"
    environment:
      BACKEND_MQTT_USER: ${BACKEND_MQTT_USER:-backend_service}
      BACKEND_MQTT_PASSWORD: ${BACKEND_MQTT_PASSWORD:?BACKEND_MQTT_PASSWORD is required in .env}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t 'plants/healthcheck' -u $${BACKEND_MQTT_USER:-backend_service} -P $${BACKEND_MQTT_PASSWORD} -E -i healthcheck || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - platform_data:/app/data
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      MQTT_USER: ${BACKEND_MQTT_USER:-backend_service}
      MQTT_PASSWORD: ${BACKEND_MQTT_PASSWORD:?BACKEND_MQTT_PASSWORD is required in .env}
      PLATFORM_DB_PATH: /app/data/platform.db
      DATABASE_URL: sqlite:////app/data/platform.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m demo.simulator.runner
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER:-device_plant_demo_membrane}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-demo_membrane_secure_token_123}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-client_demo_membrane_sim}
      PLANT_ID: plant_demo_membrane
      SIMULATOR_REPAIR_DELAY_SECONDS: ${SIMULATOR_REPAIR_DELAY_SECONDS:-90}
      SIMULATOR_DRIFT_SCALE: ${SIMULATOR_DRIFT_SCALE:-0.1}
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mosquitto_auth:
  mosquitto_data:
  platform_data:
